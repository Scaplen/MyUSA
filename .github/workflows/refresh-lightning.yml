name: Refresh NOAA GOES lightning feed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-lightning.yml
      - tools/lightning_system/**
  schedule:
    - cron: "3-53/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noaa-goes-lightning-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out MyUSA tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/lightning_system/requirements.txt

      - name: Install NOAA GLM reader
        run: python -m pip install -r tools/lightning_system/requirements.txt

      - name: Build recent satellite-lightning feed
        run: python tools/lightning_system/glm_to_geojson.py --minutes 10 --output /tmp/latest-lightning.geojson

      - name: Validate generated feed
        id: validate_feed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/latest-lightning.geojson')
          payload = json.loads(path.read_text(encoding='utf-8'))

          if payload.get('type') != 'FeatureCollection':
              raise SystemExit('invalid feed: expected FeatureCollection')
          if not isinstance(payload.get('features'), list):
              raise SystemExit('invalid feed: features must be a list')

          available = bool(payload.get('available'))
          feature_count = len(payload['features'])
          print(f'available={available} feature_count={feature_count}')

          with open(Path(__import__('os').environ['GITHUB_OUTPUT']), 'a', encoding='utf-8') as fh:
              fh.write(f'available={str(available).lower()}\n')
              fh.write(f'feature_count={feature_count}\n')
          PY

      - name: Preserve last-known-good feed when NOAA is unavailable
        if: steps.validate_feed.outputs.available != 'true'
        run: |
          echo "NOAA GOES GLM was unavailable during this refresh."
          echo "Keeping the existing lightning-data feed instead of publishing a false empty feed."

      - name: Publish the compact feed
        if: steps.validate_feed.outputs.available == 'true'
        run: |
          git config user.name "MyUSA Lightning Worker"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin lightning-data
          git switch lightning-data
          mkdir -p data
          cp /tmp/latest-lightning.geojson data/latest-lightning.geojson
          git add data/latest-lightning.geojson
          git commit --amend --no-edit
          git push --force-with-lease origin lightning-data

      - name: Check saved locations for new NWS warnings
        if: always()
        run: curl --fail --silent --show-error --max-time 60 -X POST https://myusa.us/api/push/run
