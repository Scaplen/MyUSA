name: Deploy MyUSA Google Connector

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ga4-mcp-connector
    paths:
      - 'analytics_connector/**'
      - '.github/workflows/deploy-myusa-google-connector.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: myusa-google-connector-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: optimum-sound-505003-d3
          workload_identity_provider: projects/265519813462/locations/global/workloadIdentityPools/myusa-github/providers/github
          service_account: myusa-github-deployer@optimum-sound-505003-d3.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy private scale-to-zero service
        run: |
          gcloud run deploy myusa-google-connector \
            --project=optimum-sound-505003-d3 \
            --source=analytics_connector \
            --region=us-east1 \
            --service-account=myusa-google-connector@optimum-sound-505003-d3.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --ingress=all \
            --execution-environment=gen2 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=1 \
            --port=8080 \
            --set-env-vars='MYUSA_GA4_PROPERTY_ID=527458725,MYUSA_SEARCH_CONSOLE_SITE=https://myusa.us/' \
            --quiet

      - name: Show MCP endpoint
        run: |
          URL="$(gcloud run services describe myusa-google-connector --project=optimum-sound-505003-d3 --region=us-east1 --format='value(status.url)')"
          echo "Cloud Run URL: ${URL}"
          echo "MCP endpoint: ${URL}/mcp"
